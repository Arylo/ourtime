name: mcp
version: 0.0.1
schema: v1
mcpServers:
  - name: server-memory
    command: npx
    args:
      - -y
      - "@modelcontextprotocol/server-memory"
  - name: git
    command: nvx
    args:
      - mcp-server-git
  - name: mcp-server-commands
    command: npx
    args:
      - -y
      - mcp-server-commands
  - name: filesystem
    command: npx
    args:
      - -y
      - "@modelcontextprotocol/server-filesystem"
      - "${workspaceFolder}"
